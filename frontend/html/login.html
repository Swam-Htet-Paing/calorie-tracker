<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Calorie Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/responsive-theme.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container" style="max-width: 420px; margin-top: 40px;">
    <div class="card">
      <h2 id="auth-title" style="margin-bottom: 16px;">Welcome Back</h2>
      <form id="auth-form" style="display: flex; flex-direction: column; gap: 12px;">
        <input type="text" id="username-input" placeholder="Username" class="hidden">
        
        <div id="avatar-group" class="hidden">
          <label class="custom-file-upload" for="avatar-input">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span id="file-label-text">Choose Profile Picture (Optional)</span>
          </label>
          <input type="file" id="avatar-input" accept="image/*" class="file-input-hidden">
        </div>

        <input type="email" id="email-input" placeholder="Email Address" required>
        <input type="password" id="password-input" placeholder="Password" required>
        <button type="submit" id="auth-submit-btn">Login</button>
      </form>

      <p id="auth-error" style="color: #ef4444; font-size: 0.875rem; margin-top: 12px;"></p>
      <p id="auth-success" style="color: var(--primary); font-size: 0.875rem; margin-top: 12px;"></p>

      <p style="margin-top: 16px; font-size: 0.875rem; text-align: center; color: var(--text-muted);">
        <span id="toggle-msg">Don't have an account?</span>
        <a href="#" id="toggle-auth-btn" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register</a>
      </p>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
