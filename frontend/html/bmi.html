<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator - Calorie Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/responsive-theme.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/style1.css">
</head>
<body>

  <div class="container">
    <header class="nav-container">

      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="15%">
          <defs>
            <linearGradient id="kilolog-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00F2FE" />
              <stop offset="100%" stop-color="#00F5D4" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>
          <circle cx="60" cy="60" r="25" fill="#0B0D12" />
          <g transform="translate(25, 25)">
            <circle cx="35" cy="35" r="30" fill="none" stroke="#1A2130" stroke-width="6" />
            <path d="M 35 5 A 30 30 0 1 1 8.2 20" fill="none" stroke="url(#kilolog-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
            <path d="M 27 20 L 27 50 M 27 35 L 43 20 M 27 35 L 43 50" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="43" cy="20" r="3.5" fill="#00F5D4" />
          </g>
        </svg>
        <h1>KiloLog</h1>
      </div>

      <ul class="nav-links">
        <li><a href="/dashboard.html">Log</a></li>
        <li><a href="/bmi.html">BMI</a></li>
        <li><a href="/exercise.html">Workouts</a></li>
      </ul>

      <select class="nav-dropdown" aria-label="Navigation Menu">
        <option value="/dashboard.html">Log</option>
        <option value="/bmi.html">BMI</option>
        <option value="/exercise.html">Workouts</option>
      </select>

      <div class="user-profile-widget">
        <img id="user-avatar" src="" alt="Avatar" class="user-avatar" style="cursor: pointer;" title="Click to view/change avatar">
        <span id="user-display-name" class="user-name"></span>
        <button id="logout-btn" class="logout-btn" title="Logout">Log Out</button>
      </div>

      <button class="theme-toggle-btn" aria-label="Toggle Theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </header>

    <main class="main-content-bmi">
      <div class="neo-dashboard">
        <div class="dash-header">
          <div class="title-group">
            <h1>HealthMetrics<span>360</span></h1>
            <p>Interactive Body Mass Index Analysis</p>
          </div>

          <div class="switch-pill">
            <button type="button" id="btnMetric" class="switch-btn active" onclick="setUnitSystem('metric')">Metric</button>
            <button type="button" id="btnImperial" class="switch-btn" onclick="setUnitSystem('imperial')">Imperial</button>
          </div>
        </div>

        <div class="dash-grid">
          <div class="panel controls-panel">
            <div class="control-row">
              <label>Sex Target</label>
              <div class="gender-toggle">
                <button class="g-btn active" onclick="setGender('male', this)">Male</button>
                <button class="g-btn" onclick="setGender('female', this)">Female</button>
              </div>
            </div>

            <div id="metricGroup">
              <div class="control-row">
                <div class="label-box">
                  <span>Height</span>
                  <span class="highlight"><span id="valCm">175</span> <small>cm</small></span>
                </div>
                <input type="range" id="sliderCm" min="120" max="220" value="175" class="neo-slider">
              </div>

              <div class="control-row">
                <div class="label-box">
                  <span>Weight</span>
                  <span class="highlight"><span id="valKg">70</span> <small>kg</small></span>
                </div>
                <input type="range" id="sliderKg" min="30" max="180" value="70" class="neo-slider">
              </div>
            </div>

            <div id="imperialGroup" class="hidden">
              <div class="control-row">
                <div class="label-box">
                  <span>Height</span>
                  <span class="highlight"><span id="valFt">5</span><small>ft</small> <span id="valIn">9</span><small>in</small></span>
                </div>
                <div class="dual-range">
                  <input type="range" id="sliderFt" min="3" max="7" value="5" class="neo-slider">
                  <input type="range" id="sliderIn" min="0" max="11" value="9" class="neo-slider">
                </div>
              </div>

              <div class="control-row">
                <div class="label-box">
                  <span>Weight</span>
                  <span class="highlight"><span id="valLbs">154</span> <small>lbs</small></span>
                </div>
                <input type="range" id="sliderLbs" min="70" max="400" value="154" class="neo-slider">
              </div>
            </div>

            <div class="control-row">
              <div class="label-box">
                <span>Age</span>
                <span class="highlight"><span id="valAge">25</span> <small>yrs</small></span>
              </div>
              <input type="range" id="sliderAge" min="10" max="100" value="25" class="neo-slider">
            </div>
          </div>

          <div class="panel analytics-panel">
            <div class="radial-container">
              <svg class="radial-svg" viewBox="0 0 160 160">
                <circle class="circle-bg" cx="80" cy="80" r="65"></circle>
                <circle class="circle-progress" id="circleProgress" cx="80" cy="80" r="65"></circle>
              </svg>
              <div class="radial-content">
                <span class="radial-sub">BMI INDEX</span>
                <span class="radial-score" id="bmiScore">22.9</span>
                <span class="radial-status" id="bmiStatus">Normal</span>
              </div>
            </div>

            <div class="stats-matrix">
              <div class="stat-card">
                <span class="stat-title">Target Weight</span>
                <span class="stat-value" id="targetWeight">56.7 - 76.6 kg</span>
              </div>
              <div class="stat-card">
                <span class="stat-title">Ponderal Index</span>
                <span class="stat-value" id="ponderalIndex">13.1 kg/m³</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="avatar-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="close-avatar-modal" class="modal-close">✕</button>
      <h3>Profile Picture</h3>
      <div class="modal-avatar-wrapper">
        <img id="modal-avatar-preview" src="" alt="Enlarged Avatar">
      </div>
      <div class="modal-actions">
        <label for="update-avatar-input" class="custom-file-upload">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Change Picture
        </label>
        <input type="file" id="update-avatar-input" accept="image/*" class="file-input-hidden">
      </div>
    </div>
  </div>

  <script src="../js/theme-toggle.js"></script>
  <script src="../js/index.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
