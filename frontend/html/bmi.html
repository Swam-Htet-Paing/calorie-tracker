<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator - Calorie Tracker</title>
  <link rel="stylesheet" href="../css/responsive-theme.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header class="nav-container">
      <h1>BMI</h1>

        <!-- Desktop Navigation -->
        <ul class="nav-links">
          <li><a href="/">Log</a></li>
          <li><a href="/bmi.html">BMI</a></li>
          <li><a href="/exercise.html">Workouts</a></li>
          <li><a href="/banner.html">About</a></li>
        </ul>

        <!-- Mobile Dropdown Navigation -->
        <select class="nav-dropdown" onchange="window.location.href=this.value;">
          <option value="/">Log</option>
          <option value="/bmi.html">BMI</option>
          <option value="/exercise.html">Workouts</option>
          <option value="/banner.html">About</option>
        </select>

      <button class="theme-toggle-btn" aria-label="Toggle Theme"></button>
    </header>

    <div class="card">
      <div class="form-group">
        <input type="number" id="bmi-weight" placeholder="Weight (kg)">
        <input type="number" id="bmi-height" placeholder="Height (cm)">
      </div>
      <button id="calc-bmi-btn" style="width: 100%; margin-top: 10px;">Calculate BMI</button>
    </div>

    <div class="card hidden" id="bmi-result-card">
      <h3>Your Score</h3>
      <p style="font-size: 2rem; font-weight: bold; margin: 10px 0;" id="bmi-score">0</p>
      <p id="bmi-category" style="font-weight: bold;"></p>
    </div>
  </div>

  <script src="../js/theme-toggle.js"></script>
  <script>
    document.getElementById('calc-bmi-btn').addEventListener('click', () => {
      const w = parseFloat(document.getElementById('bmi-weight').value);
      const h = parseFloat(document.getElementById('bmi-height').value) / 100;
      const resultCard = document.getElementById('bmi-result-card');
      const scoreEl = document.getElementById('bmi-score');
      const categoryEl = document.getElementById('bmi-category');

      if (!w || !h || w <= 0 || h <= 0) return;

      const bmi = (w / (h * h)).toFixed(1);
      scoreEl.textContent = bmi;

      let category = '';
      let color = '';

      if (bmi < 18.5) { category = 'Underweight'; color = '#ffc107'; }
      else if (bmi < 24.9) { category = 'Normal weight'; color = '#28a745'; }
      else if (bmi < 29.9) { category = 'Overweight'; color = '#fd7e14'; }
      else { category = 'Obese'; color = '#dc3545'; }

      categoryEl.textContent = category;
      categoryEl.style.color = color;
      resultCard.classList.remove('hidden');
    });
  </script>
</body>
</html>
