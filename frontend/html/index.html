<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calorie Tracker</title>
  <link rel="stylesheet" href="../css/responsive-theme.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header class="nav-container">
      <h1>Tracker</h1>
      
      <!-- Desktop Navigation -->
      <ul class="nav-links">
        <li><a href="/">Log</a></li>
        <li><a href="/bmi.html">BMI</a></li>
        <li><a href="/exercise.html">Workouts</a></li>
        <li><a href="/banner.html">About</a></li>
      </ul>

      <!-- Mobile Dropdown Navigation -->
      <select class="nav-dropdown" onchange="window.location.href=this.value;">
        <option value="/">Log</option>
        <option value="/bmi.html">BMI</option>
        <option value="/exercise.html">Workouts</option>
        <option value="/banner.html">About</option>
      </select>

      <button class="theme-toggle-btn" aria-label="Toggle Theme"></button>
    </header>

    <!-- App Cards -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2>Daily Log</h2>
        <input type="date" id="log-date-picker">
      </div>
      <ul id="calorie-log" class="log-list"></ul>
      <div class="total-container">
        <strong>Total Calories: </strong>
        <span id="total-calories">0</span> kcal
      </div>
    </div>

    <div class="card">
      <h2>Search Food</h2>
      <div class="form-group">
        <input type="text" id="food-input" placeholder="e.g., Apple, Chicken Breast">
        <button id="search-btn">Search</button>
      </div>
      <ul id="search-results" class="results-list"></ul>
    </div>

    <div class="card hidden" id="portion-card">
      <h3>Add Portion</h3>
      <p id="selected-food-name"></p>
      <div class="form-group">
        <input type="number" id="weight-input" placeholder="Weight in grams" value="100">
        <button id="add-btn">Add to Log</button>
      </div>
    </div>
  </div>

  <script src="../js/theme-toggle.js"></script>
  <script src="../js/index.js"></script>
</body>
</html>
