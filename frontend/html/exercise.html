<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Guides - Calorie Tracker</title>
  <link rel="stylesheet" href="../css/responsive-theme.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .tab-btn {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      border-radius: 4px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--primary-btn);
      color: white;
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="nav-container">
      <h1>Workouts</h1>

      <!-- Desktop Navigation -->
      <ul class="nav-links">
        <li><a href="/">Log</a></li>
        <li><a href="/bmi.html">BMI</a></li>
        <li><a href="/exercise.html">Workouts</a></li>
        <li><a href="/banner.html">About</a></li>
      </ul>

      <!-- Mobile Dropdown Navigation -->
      <select class="nav-dropdown" onchange="window.location.href=this.value;">
        <option value="/">Log</option>
        <option value="/bmi.html">BMI</option>
        <option value="/exercise.html">Workouts</option>
        <option value="/banner.html">About</option>
      </select>

      <button class="theme-toggle-btn" aria-label="Toggle Theme"></button>
    </header>

    <div class="card" style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
      <button class="tab-btn active" onclick="switchVideo('cardio', this)">Cardio</button>
      <button class="tab-btn" onclick="switchVideo('weightloss', this)">Weight Loss</button>
      <button class="tab-btn" onclick="switchVideo('gym', this)">Gym / Weights</button>
      <button class="tab-btn" onclick="switchVideo('calisthenics', this)">Calisthenics</button>
    </div>

    <div class="card">
      <div class="video-container">
        <iframe id="youtube-frame" 
          src="https://www.youtube-nocookie.com/embed/ml6cT4AZdqI" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <script src="../js/theme-toggle.js"></script>
  <script>
    const videos = {
      cardio: "https://www.youtube-nocookie.com/embed/ml6cT4AZdqI",
      weightloss: "https://www.youtube-nocookie.com/embed/gC_L9qAHVJ8",
      gym: "https://www.youtube-nocookie.com/embed/U9ENCvFfjhY",
      calisthenics: "https://www.youtube-nocookie.com/embed/vc1E5CFRaws"
    };

    function switchVideo(cat, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('youtube-frame').src = videos[cat];
    }
  </script>
</body>
</html>
